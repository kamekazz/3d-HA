<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rear exterior · Live build</title>
<style>body{margin:0;background:#121719;color:#e6edee;font:16px system-ui,sans-serif}header,main{max-width:1600px;margin:auto;padding:24px}header{border-bottom:1px solid #344145}h1{font-size:28px;margin:8px 0}p{color:#a6b9bf}.dot{display:inline-block;width:8px;height:8px;background:#7fe0b4;border-radius:50%;margin-right:8px}nav{display:flex;gap:16px}a{color:#8cd4e8}#cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(500px,1fr));gap:20px}article{background:#1b2529;padding:15px;border:1px solid #35464e;border-radius:10px}h2{font-size:17px;font-weight:500}img{width:100%;height:auto;display:block;background:#101517}.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}small{display:block;color:#99acb3;margin:9px 0}.badge{font-size:13px;color:#7fe0b4}#history{white-space:pre-wrap;line-height:1.6}@media(max-width:600px){#cards{grid-template-columns:1fr}.pair{grid-template-columns:1fr}}</style>
<header><span class="badge"><span class="dot"></span>LOCAL LIVE PROGRESS</span><h1>Rear exterior rebuild</h1><p id="status">Connecting to progress…</p><small id="updated"></small><nav><a href="http://127.0.0.1:5001/" target="_blank">Open 3D app</a><a href="progress.json">Progress data</a><a href="references/contact-sheet.png">Reference contact sheet</a></nav></header>
<style>#cards>article:first-child{grid-column:1/-1}#cards>article:first-child .pair{grid-template-columns:1fr}#cards>article:first-child img{max-height:850px;object-fit:contain}#spacing{padding:14px 18px;border-left:3px solid #7fe0b4;background:#1b2529;color:#e6edee}</style>
<main><p id="spacing">Lawn expanded 20 feet toward the lake. The shoreline and woodland now sit farther from the house. The front yard is unchanged.</p><p id="details"></p><div id="pieces" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-bottom:24px"></div><div id="cards"></div><p id="history"></p></main>
<script>
const cameraTitles={lawn_spacing:'Lawn spacing · house toward lake',rear_site:'Rear site · lake toward house',photo09:'Back elevation · from the north lawn',photo14:'Porch and upper deck · northeast viewpoint',photo02:'Deck and TV wall · northeast viewpoint',photo12:'Lawn and tree border · looking north',photo11:'Lake edge and far shore · looking north'};
let stamp='';const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function refresh(){try{const p=await fetch('progress.json?'+Date.now()).then(r=>r.json());document.querySelector('#status').textContent=p.status||'Work in progress';document.querySelector('#details').textContent=p.details||'';document.querySelector('#updated').textContent='Updated '+new Date(p.updated).toLocaleString();if(stamp!==p.updated){stamp=p.updated;document.querySelector('#pieces').innerHTML=Object.entries(p.pieces||{}).map(([name,v])=>`<article><h2>${esc(name)}</h2><small>${esc(v.status)}</small><p>${esc(v.gap)}</p></article>`).join('');document.querySelector('#cards').innerHTML=Object.entries(p.renders||{}).map(([name,src])=>`<article><h2>${esc(cameraTitles[name] || name.replaceAll('_',' '))}</h2><div class="pair">${p.references?.[name]?`<div><small>Reference photograph</small><a href="${esc(p.references[name])}" target="_blank"><img loading="lazy" src="${esc(p.references[name])}"></a></div>`:''}<div><small>Real app · ${esc(src.split('/')[1])}</small><a href="${esc(src)}" target="_blank"><img loading="lazy" src="${esc(p.previews?.[name] || src)}"></a></div></div></article>`).join('');document.querySelector('#history').textContent=(p.notes||[]).join('\n');}}catch(e){document.querySelector('#status').textContent='Waiting for the next progress update';}}
refresh();setInterval(refresh,2000);
</script></html>
